version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: financeflow-postgres
    environment:
      POSTGRES_USER: financeflow
      POSTGRES_PASSWORD: dev_password_change_me
      POSTGRES_DB: financeflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeflow-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: financeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeflow-network

  # Prisma Studio (Database UI)
  prisma-studio:
    image: node:18-alpine
    container_name: financeflow-prisma-studio
    working_dir: /app
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://financeflow:dev_password_change_me@postgres:5432/financeflow_dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - financeflow-network
    command: npx prisma studio

volumes:
  postgres_data:
  redis_data:

networks:
  financeflow-network:
    driver: bridge
